# Docker Compose — Pion-G-Hub (Staging / Produção)
# Orquestra backend (Node.js) e frontend (Nginx)

services:
  # ============================================================
  # Backend — API Node.js + Express
  # ============================================================
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: piong-hub-backend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    env_file:
      - .env
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/health', (r) => { process.exit(r.statusCode === 200 ? 0 : 1) })"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 10s
    networks:
      - piong-hub-network
    labels:
      com.hostinger.description: "Pion-G-Hub Backend API"

  # ============================================================
  # Frontend — Nginx servindo React build
  # ============================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: piong-hub-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:80/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - piong-hub-network
    labels:
      com.hostinger.description: "Pion-G-Hub Frontend (Nginx)"

# ============================================================
# Network
# ============================================================
networks:
  piong-hub-network:
    driver: bridge
    name: piong-hub-network
